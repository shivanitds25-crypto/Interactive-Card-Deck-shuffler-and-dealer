<!DOCTYPE html>
<html>
<head>
  <title>Product Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

<h1 class="text-3xl font-bold text-center mb-6">Product Collection</h1>

<div class="flex flex-col md:flex-row gap-5">

  <div class="bg-white p-4 rounded shadow w-full md:w-1/3">
    <img src="https://via.placeholder.com/200" class="w-full">
    <h2 class="text-xl font-bold mt-3">Smart Watch</h2>
    <p>Stylish and modern smartwatch.</p>
    <p class="font-bold">₹2999</p>
    <button class="bg-blue-500 text-white px-4 py-2 mt-2 rounded">
      Buy Now
    </button>
  </div>

  <div class="bg-white p-4 rounded shadow w-full md:w-1/3">
    <img src="https://via.placeholder.com/200" class="w-full">
    <h2 class="text-xl font-bold mt-3">Headphones</h2>
    <p>High quality wireless headphones.</p>
    <p class="font-bold">₹1999</p>
    <button class="bg-blue-500 text-white px-4 py-2 mt-2 rounded">
      Buy Now
    </button>
  </div>

  <div class="bg-white p-4 rounded shadow w-full md:w-1/3">
    <img src="https://via.placeholder.com/200" class="w-full">
    <h2 class="text-xl font-bold mt-3">Running Shoes</h2>
    <p>Comfortable and lightweight.</p>
    <p class="font-bold">₹2499</p>
    <button class="bg-blue-500 text-white px-4 py-2 mt-2 rounded">
      Buy Now
    </button>
  </div>

</div>
</body>
</html>
