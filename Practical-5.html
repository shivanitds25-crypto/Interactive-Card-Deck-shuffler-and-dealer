<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">
  <h1 class="text-3xl font-bold text-center mb-6">🍴 Popular Dishes</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

    <div class="bg-white rounded-lg shadow p-4">
      <img src="pizza.jpg" class="w-full h-40 object-cover rounded">
      <h2 class="text-xl font-bold mt-3">Pizza</h2>
      <p class="text-gray-600">Cheesy and delicious Italian pizza.</p>
      <button class="bg-orange-500 text-white px-4 py-2 mt-3 rounded">
        Order Now
      </button>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <img src="burger.jpg" class="w-full h-40 object-cover rounded">
      <h2 class="text-xl font-bold mt-3">Burger</h2>
      <p class="text-gray-600">Juicy burger with fresh vegetables.</p>
      <button class="bg-orange-500 text-white px-4 py-2 mt-3 rounded">
        Order Now
      </button>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <img src="pasta.jpg" class="w-full h-40 object-cover rounded">
      <h2 class="text-xl font-bold mt-3">Pasta</h2>
      <p class="text-gray-600">Creamy pasta with rich Italian flavors.</p>
      <button class="bg-orange-500 text-white px-4 py-2 mt-3 rounded">
        Order Now
      </button>
    </div>

  </div>
</body>
</html>
